version: "3.8"

services:
    api:
        build: .
        image: ladefuchs-api:0.3.1
        container_name: ladefuchs-api
        environment:
            AUTH_TOKEN: "${AUTH_TOKEN}"
            DATABASE_URL: "postgres://${POSTGRES_USER:-adminfuchs}:${POSTGRES_PASSWORD-ringdingdingding}@db:${POSTGRES_PORT-5432}/${POSTGRES_DB:-ladefuchs}"
            CHARGE_PRICE_API_KEY: "${CHARGE_PRICE_API_KEY}"
            LISTEN: "${LISTEN:-0.0.0.0}"
            PORT: "${PORT:-3000}"
            IMAGE_PATH: "${IMAGE_PATH:-./cards}"
            SLACK_TOKEN: "${SLACK_TOKEN:-''}"
            SLACK_CHANNEL: "${SLACK_CHANNEL:-''}"
            DOMAIN: "${DOMAIN:-localhots}"
        depends_on:
            - db
        ports:
            - "${PORT:-3000}:3000"
        volumes:
            - ./cards:/deploy/cards
    db:
        image: postgres:14-alpine
        restart: unless-stopped
        container_name: ladefuchs-db
        hostname: db
        environment:
            POSTGRES_USER: "${POSTGRES_USER:-adminfuchs}"
            POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-ringdingdingding}"
            POSTGRES_DB: "${POSTGRES_DB:-ladefuchs}"
            PGDATA: "/var/lib/postgresql/data"
            TZ: "GMT+2"
        ports:
            - "${POSTGRES_PORT-5432}:5432"
        volumes:
            - ./db_data:/var/lib/postgresql/data
    caddy:
        image: caddy:2-alpine
        container_name: ladefuchs-caddy
        restart: unless-stopped
        ports:
            - "80:80"
            - "443:443"
        volumes:
            - ./caddy/caddyfile:/etc/caddy/Caddyfile
            - ./caddy/data:/data
            - ./cards:/cards
            - ./caddy/config:/config
    swagger_ui:
        image: swaggerapi/swagger-ui:latest
        container_name: ladefuchs-swagger-ui
        restart: unless-stopped
        volumes:
            - ./docs/openapi.yml:/app/openapi.yml
            - ./docs/swagger-ui.css:/usr/share/nginx/html/index.css
        ports:
            - 4000:8080
        environment:
            BASE_URL: "/docs/"
            SWAGGER_JSON: "/app/openapi.yml"
            SWAGGER_JSON_URL: "./openapi.yml"
