version: "3.8"

services:
    db:
        image: postgres:14-alpine
        restart: unless-stopped
        environment:
            POSTGRES_USER: "${POSTGRES_USER:-adminfuchs}"
            POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-ringdingdingdingdingading}"
            POSTGRES_DB: "${POSTGRES_DB:-ladefuchs}"
            PGDATA: "/var/lib/postgresql/data"
            TZ: "GMT+2"
        ports:
            - "${POSTGRES_PORT-5432}:5432"
        volumes:
            - ./db_data:/var/lib/postgresql/data
    swagger_ui:
        image: swaggerapi/swagger-ui:latest
        restart: unless-stopped
        volumes:
            - ./openapi.yml:/app/swagger.json
        ports:
            - 4000:8080
        environment:
            BASE_URL: "/docs/"