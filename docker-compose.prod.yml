version: "3"

services:
    api:
        image: dominicwrege/ladefuchs-api:latest
        restart: unless-stopped:1
        container_name: ladefuchs-api
        environment:
            DATABASE_URL: "postgres://${POSTGRES_USER?:err}:${POSTGRES_PASSWORD?:err}@db:${POSTGRES_PORT-5432}/${POSTGRES_DB:-ladefuchs}"
            CHARGE_PRICE_API_KEY: "${CHARGE_PRICE_API_KEY?:err}"
            LISTEN: "${LISTEN:-0.0.0.0}"
            PORT: "${PORT:-3000}"
            DOMAIN: "${DOMAIN?:err}"
            ADMIN_DOMAIN: "${ADMIN_DOMAIN?:err}"
            SLACK_TOKEN: "${SLACK_TOKEN?:err}"
            SLACK_CHANNEL: "${SLACK_CHANNEL?:err}"
        depends_on:
            - db
        volumes:
            - ./images:/deploy/images
    db:
        image: postgres:15-alpine
        restart: unless-stopped:3
        container_name: ladefuchs-db
        hostname: db
        environment:
            POSTGRES_USER: "${POSTGRES_USER:-adminfuchs}"
            POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-ringdingdingding}"
            POSTGRES_DB: "${POSTGRES_DB:-ladefuchs}"
            PGDATA: "/var/lib/postgresql/data"
            TZ: "GMT+2"
        ports:
            - "${POSTGRES_PORT-5432}:5432"
        volumes:
            - ./db_data:/var/lib/postgresql/data
        command: postgres -c shared_buffers=512MB
        shm_size: 512m
    caddy:
        image: caddy:2-alpine
        container_name: ladefuchs-caddy
        restart: unless-stopped
        ports:
            - 80:80
            - 443:443
            - "443:443/udp"
        volumes:
            - ./caddy/file:/etc/caddy
            - ./caddy/data:/data
            - ./cards:/cards
            - ./caddy/config:/config
    watchtower:
        image: containrrr/watchtower
        container_name: ladefuchs-watchtower
        restart: unless-stopped
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock
        environment:
            WATCHTOWER_CLEANUP: true
            WATCHTOWER_HTTP_API_UPDATE: true
            WATCHTOWER_ROLLING_RESTART: true
            WATCHTOWER_HTTP_API_TOKEN: ${WATCHTOWER_HTTP_API_TOKEN?:err}
            REPO_USER: ${DOCKERHUB_USERNAME?:err}
            REPO_PASS: ${DOCKERHUB_PASSWORD?:err}
networks:
    default:
        name: ladefuchs-backend
        external: true
