name: Docker-Build-CI
on:
  release:
    types: [published]
jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v3
        with:
          push: true
          tags: dominicwrege/ladefuchs-api:latest,dominicwrege/ladefuchs-api:${{ github.ref_name }}
      - name: Trigger Watchtower HTTP event
        shell: bash
        env:
          WATCHTOWER_HTTP_API_TOKEN: ${{ secrets.WATCHTOWER_HTTP_API_TOKEN }}
          WATCHTOWER_HTTP_ENDPOINT: ${{ secrets.WATCHTOWER_HTTP_ENDPOINT }}
        run: |
          curl --fail -s --max-time 12 -H "Authorization: Bearer ${WATCHTOWER_HTTP_API_TOKEN}" -I $WATCHTOWER_HTTP_ENDPOINT
