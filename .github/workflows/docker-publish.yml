name: Docker-Build
on:
  release:
    types: [published]
jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v3
        with:
          push: true
          tags: dominicwrege/ladefuchs-api:latest,dominicwrege/ladefuchs-api:${{ github.ref_name }}
      - name: Trigger Watchtower HTTP event
        shell: bash
        env:
          watchtower_http_api_token: ${{ secrets.WATCHTOWER_HTTP_API_TOKEN }}
          watchtower_http_api: ${{ secrets.WATCHTOWER_HTTP_API }}
        run: |
          curl --fail -H "Authorization: Bearer $WATCHTOWER_HTTP_API_TOKEN" "$WATCHTOWER_HTTP_API"
