name: "Build Image"
on:
  push:
    branches:
      - test
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: https://github.com/cachix/install-nix-action@v31
        with:
          packages: docker
          github_access_token: ${{ secrets.GH_TOKEN }}
      - run: |
          docker load -i "$(nix build ./nix#image-latest --print-out-paths --no-link)"
          docker load -i "$(nix build ./nix#image-versioned --print-out-paths --no-link)"
      - name: Login to Github
        uses: https://github.com/docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ secrets.GH_USERNAME }}
          password: ${{ secrets.GH_TOKEN }}
      - name: Build and push
        uses: https://github.com/docker/build-push-action@v6
        with:
          push: true
          tags: ghcr.io/team-ladefuchs/ladefuchs-api:latest,ghcr.io/team-ladefuchs/ladefuchs-api:${{ github.ref_name }}
