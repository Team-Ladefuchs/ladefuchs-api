services:
  db:
    restart: always
    container_name: postgresql
    image: docker.io/postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: "/var/lib/postgresql/data"
      TZ: "GMT+2"
    ports:
      - "5432:5432"
    volumes:
      - ./db_data:/var/lib/postgresql/data
  api:
    image: ghcr.io/team-ladefuchs/ladefuchs-api:2.0.9
    restart: unless-stopped:1
    container_name: ladefuchs-api
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER?:err}:${POSTGRES_PASSWORD?:err}@db:${POSTGRES_PORT-5432}/${POSTGRES_DB:-ladefuchs}"
      ADMIN_USER: "${ADMIN_USER?:err}"
      ADMIN_PWD: "${ADMIN_PWD?:err}"
    depends_on:
      - db
    volumes:
      - ./images:/deploy/images:ro
      - ./docs:/deploy/docs:ro
