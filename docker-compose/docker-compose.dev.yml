version: "3.8"

services:
    db:
        restart: always
        image: docker.io/postgres:15-alpine
        environment:
            POSTGRES_USER: "${POSTGRES_USER:-adminfuchs}"
            POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-ringdingdingdingdingading}"
            POSTGRES_DB: "${POSTGRES_DB:-ladefuchs}"
            PGDATA: "/var/lib/postgresql/data"
            TZ: "GMT+2"
        ports:
            - "${POSTGRES_PORT-5432}:5432"
        volumes:
            - ../db_data:/var/lib/postgresql/data
