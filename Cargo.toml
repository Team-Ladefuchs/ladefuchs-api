[package]
name = "ladefuchs-api"
version = "0.7.7"
edition = "2021"
license = "MIT"

[profile.release]
strip = "debuginfo"
opt-level = 3
debug = false

[dependencies]
thiserror = "1.0.38"
tokio = { version = "1.24.1", features = ["macros", "net", "fs", "rt", "time"] }
sqlx = { version = "0.6.2", default-features = false, features = [ "runtime-tokio-rustls", "postgres", "migrate", "macros", "chrono", "uuid", "offline"] }
reqwest = { version = "0.11.13", default-features = false, features = ["json", "rustls-tls"] } 
eyre = "0.6.8"
serde = { version = "1.0.152", features = ["derive"] }
serde_json = "1.0.91"
axum = { version = "0.6.2", features = ["http2", "tower-log", "query", "macros", "headers"] }
tracing = "0.1.37"
tracing-subscriber = { version = "0.3.16", features = ["env-filter", "json", "ansi", "time"] }
uuid = { version = "1.2.2", features = ["serde", "v4"] }
envy = "0.4.2"
url = { version = "2.3.1", features = ["serde"] }
trace = "0.1.7"
tower-http = { version = "0.3.5", features = ["trace", "compression-deflate", "cors", "sensitive-headers", "fs"] }
tower-cookies = { version = "0.8.0", features = ["private", "signed"] }
strum = { version = "0.24.1", features = ["derive"] }
strum_macros = "0.24.3"
futures-util = "0.3.25"
mime = "0.3.16"
chrono = { version = "0.4.23", features = ["serde"] }
tower = "0.4.13"
const_format = "0.2.30"
hotwatch = "0.4.6"
blake3 = "1.3.3"
tree_magic_mini = "3.0.3"
regex = "1.7.0"
once_cell = "1.17.0"
tokio-util = { version = "0.7.4", features = ["io"] }
serde_with = { version = "2.1.0", features = ["chrono"] }
rand = "0.8.5"
bcrypt = "0.13.0"
cookie = "0.16.2"
urlencoding = "2.1.2"
paste = "1.0.11"
base64 = "0.20.0"

