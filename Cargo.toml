[package]
name = "ladefuchs-api"
version = "0.4.7"
edition = "2021"
license = "MIT"

[profile.release]
strip = "debuginfo"
opt-level = 3
debug = false

[dependencies]
thiserror = "1.0.31"
tokio = { version = "1.19.2", features = ["macros", "net", "fs", "rt"] }
sqlx = { version = "0.6.0", default-features = false, features = [ "runtime-tokio-rustls", "postgres", "migrate", "macros", "chrono", "uuid", "offline"] }
reqwest = { version = "0.11.11", default-features = false, features = ["json", "rustls-tls"] } 
eyre = "0.6.8"
serde = { version = "1.0.138", features = ["derive"] }
serde_json = "1.0.82"
axum = { version = "0.5.11", features = ["http2", "tower-log"] }
tracing = "0.1.35"
tracing-subscriber = { version = "0.3.14", features = ["env-filter", "json", "ansi", "time"] }
uuid = { version = "1.1.2", features = ["serde", "v4"] }
envy = "0.4.2"
url = { version = "2.2.2", features = ["serde"] }
trace = "0.1.6"
tower-http = { version = "0.3.4", features = ["trace", "compression-deflate", "cors", "sensitive-headers"] }
tower-cookies = { version = "0.7.0", features = ["private", "signed"] }
strum = { version = "0.24.1", features = ["derive"] }
strum_macros = "0.24.2"
futures-util = "0.3.21"
mime = "0.3.16"
chrono = { version = "0.4.19", features = ["serde"] }
tower = "0.4.13"
const_format = "0.2.25"
hotwatch = "0.4.6"
blake3 = "1.3.1"
tree_magic_mini = "3.0.3"
regex = "1.5.6"
once_cell = "1.12.1"
tokio-util = { version = "0.7.3", features = ["io"] }
serde_with = "1.14.0"
rand = "0.8.5"
bcrypt = "0.13.0"
cookie = "0.16.0"

