[package]
name = "ladefuchs-api"
version = "1.20.9"
edition = "2021"

[profile.release]
strip = "debuginfo"
opt-level = 3
debug = false

[dependencies]
thiserror = "1.0.59"
tokio = { version = "1.37.0", features = [
	"macros",
	"net",
	"fs",
	"rt-multi-thread",
	"time",
	"signal",
] }
sqlx = { version = "0.7.4", default-features = false, features = [
	"runtime-tokio-rustls",
	"postgres",
	"migrate",
	"macros",
	"chrono",
	"uuid",
] }
reqwest = { version = "0.12.4", default-features = false, features = [
	"json",
	"rustls-tls",
] }
eyre = "0.6.12"
serde = { version = "1.0.198", features = ["derive"] }
serde_json = { version = "1.0.116", features = ["raw_value"] }
axum = { version = "0.7.5", features = [
	"http2",
	"tower-log",
	"query",
	"macros",
] }
axum-extra = { version = "0.9.3", features = ["typed-header"] }
axum-login = "0.15.1"
headers = "0.4.0"
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = [
	"env-filter",
	"json",
	"ansi",
	"time",
] }
uuid = { version = "1.8.0", features = ["serde", "v4"] }
envy = "0.4.2"
url = { version = "2.5.0", features = ["serde"] }
time = "0.3.36"
trace = "0.1.7"
tower-http = { version = "0.5.2", features = [
	"trace",
	"compression-deflate",
	"cors",
	"sensitive-headers",
	"fs",
] }
strum_macros = "0.26.2"
futures-util = "0.3.30"
mime = "0.3.17"
chrono = { version = "0.4.38", features = ["serde"] }
tower = "0.4.13"
hotwatch = "0.5.0"
blake3 = "1.5.1"
tree_magic_mini = "3.1.4"
regex = "1.10.4"
once_cell = "1.19.0"
tokio-util = { version = "0.7.10", features = ["io"] }
serde_with = { version = "3.8.0", features = ["chrono"] }
rand = "0.8.5"
bcrypt = "0.15.1"
paste = "1.0.14"
base64 = "0.22.0"
console-subscriber = "0.2.0"
percent-encoding = "2.3.1"
