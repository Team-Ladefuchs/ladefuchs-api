[package]
name = "ladefuchs-api"
version = "2.4.0"
edition = "2024"
default-run = "ladefuchs-api"

[lib]
doctest = false

[profile.release]
strip = "debuginfo"
opt-level = 3
debug = false

[dependencies]
thiserror = "2.0.18"
tokio = { version = "1.50.0", features = [
	"macros",
	"net",
	"fs",
	"rt-multi-thread",
	"time",
	"signal",
] }
sqlx = { version = "0.8.6", default-features = false, features = [
	"runtime-tokio-rustls",
	"postgres",
	"migrate",
	"macros",
	"chrono",
	"json",
	"uuid",
] }
reqwest = { version = "0.13.1", default-features = false, features = [
	"json",
	"rustls",
	"query"
] }
eyre = "0.6.12"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.149", features = ["raw_value"] }
axum = { version = "0.8.8", features = [
	"http2",
	"tower-log",
	"query",
	"macros",
] }
axum-extra = { version = "0.12.5", features = ["typed-header", "cookie"] }
headers = "0.4.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = [
	"env-filter",
	"json",
	"ansi",
	"time",
] }
uuid = { version = "1.22.0", features = ["serde", "v4", "v7"] }
envy = "0.4.2"
url = { version = "2.5.8", features = ["serde"] }
time = "0.3.47"
trace = "0.1.7"
tower-http = { version = "0.6.8", features = [
	"trace",
	"compression-deflate",
	"cors",
	"sensitive-headers",
	"fs",
] }
strum_macros = "0.28.0"
futures-util = "0.3.32"
mime = "0.3.17"
chrono = { version = "0.4.44", features = ["serde"] }
tower = "0.5.3"
hotwatch = "0.5.0"
blake3 = "1.8.3"
tree_magic_mini = "3.2.2"
regex = "1.12.3"
once_cell = "1.21.3"
tokio-util = { version = "0.7.18", features = ["io"] }
serde_with = { version = "3.17.0", features = ["chrono"] }
rand = "0.10.0"
bcrypt = "0.19.0"
paste = "1.0.15"
base64 = "0.22.1"
console-subscriber = "0.5.0"
jsonwebtoken = { version = "10.3.0", features = ["rust_crypto"] }
tower-cookies = "0.11.0"
async-trait = "0.1.89"
async-stream = "0.3.6"
celes = "2.8.2"
tokio-cron-scheduler = { version = "0.15.1", features = [
	"signal",
	"tracing-subscriber",
] }

[features]
testing = []

[dev-dependencies]
pretty_assertions = "1.4"
