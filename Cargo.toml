[package]
name = "ladefuchs-api"
version = "1.29.0"
edition = "2021"

[profile.release]
strip = "debuginfo"
opt-level = 3
debug = false

[dependencies]
thiserror = "1.0.64"
tokio = { version = "1.40.0", features = [
	"macros",
	"net",
	"fs",
	"rt-multi-thread",
	"time",
	"signal",
] }
sqlx = { version = "0.8.2", default-features = false, features = [
	"runtime-tokio-rustls",
	"postgres",
	"migrate",
	"macros",
	"chrono",
	"uuid",
] }
reqwest = { version = "0.12.8", default-features = false, features = [
	"json",
	"rustls-tls",
] }
eyre = "0.6.12"
serde = { version = "1.0.210", features = ["derive"] }
serde_json = { version = "1.0.128", features = ["raw_value"] }
axum = { version = "0.7.7", features = [
	"http2",
	"tower-log",
	"query",
	"macros",
] }
axum-extra = { version = "0.9.4", features = ["typed-header"] }
axum-login = "0.16.0"
headers = "0.4.0"
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = [
	"env-filter",
	"json",
	"ansi",
	"time",
] }
uuid = { version = "1.10.0", features = ["serde", "v4", "v7"] }
envy = "0.4.2"
url = { version = "2.5.2", features = ["serde"] }
time = "0.3.36"
trace = "0.1.7"
tower-http = { version = "0.6.1", features = [
	"trace",
	"compression-deflate",
	"cors",
	"sensitive-headers",
	"fs",
] }
strum_macros = "0.26.4"
futures-util = "0.3.30"
mime = "0.3.17"
chrono = { version = "0.4.38", features = ["serde"] }
tower = "0.5.1"
hotwatch = "0.5.0"
blake3 = "1.5.4"
tree_magic_mini = { version = "3.1.5" }
regex = "1.11.0"
once_cell = "1.20.1"
tokio-util = { version = "0.7.12", features = ["io"] }
serde_with = { version = "3.10.0", features = ["chrono"] }
rand = "0.8.5"
bcrypt = "0.15.1"
paste = "1.0.15"
base64 = "0.22.1"
console-subscriber = "0.4.0"
