[package]
name = "ladefuchs-api"
version = "0.1.6"
edition = "2021"
license = "MIT"

[profile.release]
strip = "debuginfo"
opt-level = 3
debug = false

[dependencies]
thiserror = "1.0.30"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.5", default-features = false, features = [ "runtime-tokio-rustls", "postgres", "migrate", "macros", "chrono", "uuid", "offline"] }
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"]} 
eyre = "0.6"
serde = { version = "1.0.136", features = ["derive"] }
serde_json = "1.0.79"
axum = { version = "0.5.1", features = ["http2", "tower-log"] }
tracing = "0.1.34"
tracing-subscriber = {version = "0.3.9", features = ["env-filter", "json"] }
uuid = { version = "0.8", features = ["serde", "v4"] }
envy = "0.4.2"
url = { version = "2", features = ["serde"] }
trace = "0.1.6"
tower-http = { version = "0.2.3", features = ["trace", "compression-deflate"] }
strum = { version = "0.24", features = ["derive"] }
strum_macros = "0.24.0"
futures-util = "0.3.21"
mime = "0.3.16"
chrono = { version = "0.4.19", features = ["serde"] }
tower = "0.4.12"
const_format = "0.2.22"
