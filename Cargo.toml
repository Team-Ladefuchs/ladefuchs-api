[package]
name = "ladefuchs-api"
version = "1.4.3"
edition = "2021"
license = "MIT"

[profile.release]
strip = "debuginfo"
opt-level = 3
debug = false

[dependencies]
thiserror = "1.0.43"
tokio = { version = "1.29.1", features = ["macros", "net", "fs", "rt-multi-thread", "time", "signal"] }
sqlx = { version = "0.7.1", default-features = false, features = [ "runtime-tokio-rustls", "postgres", "migrate", "macros", "chrono", "uuid"] }
reqwest = { version = "0.11.18", default-features = false, features = ["json", "rustls-tls"] } 
eyre = "0.6.8"
serde = { version = "1.0.174", features = ["derive"] }
serde_json = "1.0.103"
axum = { version = "0.6.19", features = ["http2", "tower-log", "query", "macros", "headers"] }
tracing = "0.1.37"
tracing-subscriber = { version = "0.3.17", features = ["env-filter", "json", "ansi", "time"] }
uuid = { version = "1.4.1", features = ["serde", "v4"] }
envy = "0.4.2"
url = { version = "2.4.0", features = ["serde"] }
trace = "0.1.7"
tower-http = { version = "0.4.2", features = ["trace", "compression-deflate", "cors", "sensitive-headers", "fs"] }
tower-cookies = { version = "0.9.0", features = ["private", "signed"] }
strum = { version = "0.25.0", features = ["derive"] }
strum_macros = "0.25.1"
futures-util = "0.3.28"
mime = "0.3.17"
chrono = { version = "0.4.26", features = ["serde"] }
tower = "0.4.13"
hotwatch = "0.5.0"
blake3 = "1.4.1"
tree_magic_mini = "3.0.3"
regex = "1.9.1"
once_cell = "1.18.0"
tokio-util = { version = "0.7.8", features = ["io"] }
serde_with = { version = "3.1.0", features = ["chrono"] }
rand = "0.8.5"
bcrypt = "0.15.0"
urlencoding = "2.1.2"
paste = "1.0.14"
base64 = "0.21.2"

