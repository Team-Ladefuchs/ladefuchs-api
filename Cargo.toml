[package]
name = "ladefuchs-api"
version = "1.17.1"
edition = "2021"
license = "MIT"

[profile.release]
strip = "debuginfo" 
opt-level = 3
debug = false

[dependencies]
thiserror = "1.0.56"
tokio = { version = "1.35.1", features = ["macros", "net", "fs", "rt-multi-thread", "time", "signal"] }
sqlx = { version = "0.7.3", default-features = false, features = [ "runtime-tokio-rustls", "postgres", "migrate", "macros", "chrono", "uuid"] }
reqwest = { version = "0.11.23", default-features = false, features = ["json", "rustls-tls"] } 
eyre = "0.6.11"
serde = { version = "1.0.194", features = ["derive"] }
serde_json =  { version = "1.0.109", features = ["raw_value"] }
axum = { version = "0.7.3", features = ["http2", "tower-log", "query", "macros"] }
axum-extra = { version = "0.9.1", features = ["typed-header"] }
axum-login = "0.12"
headers = "0.4.0"
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["env-filter", "json", "ansi", "time"] }
uuid = { version = "1.6.1", features = ["serde", "v4"] }
envy = "0.4.2"
url = { version = "2.5.0", features = ["serde"] }
time = "0.3.31"
trace = "0.1.7"
tower-http = { version = "0.5.0", features = ["trace", "compression-deflate", "cors", "sensitive-headers", "fs"] }
strum_macros = "0.25.3"
futures-util = "0.3.30"
mime = "0.3.17"
chrono = { version = "0.4.31", features = ["serde"] }
tower = "0.4.13"
hotwatch = "0.5.0"
blake3 = "1.5.0"
tree_magic_mini = "3.0.3"
regex = "1.10.2"
once_cell = "1.19.0"
tokio-util = { version = "0.7.10", features = ["io"] }
serde_with = { version = "3.4.0", features = ["chrono"] }
rand = "0.8.5"
bcrypt = "0.15.0"
paste = "1.0.14"
base64 = "0.21.5"
console-subscriber = "0.2.0"
percent-encoding = "2.3.1"
