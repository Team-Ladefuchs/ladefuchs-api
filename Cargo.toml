[package]
name = "ladefuchs-api"
version = "0.4.0"
edition = "2021"
license = "MIT"

[profile.release]
strip = "debuginfo"
opt-level = 3
debug = false

[dependencies]
thiserror = "1.0.31"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.5", default-features = false, features = [ "runtime-tokio-rustls", "postgres", "migrate", "macros", "chrono", "uuid", "offline"] }
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"]} 
eyre = "0.6"
serde = { version = "1.0.137", features = ["derive"] }
serde_json = "1.0.81"
axum = { version = "0.5.7", features = ["http2", "tower-log"] }
tracing = "0.1.34"
tracing-subscriber = {version = "0.3.9", features = ["env-filter", "json", "ansi", "time"] }
uuid = { version = "0.8", features = ["serde", "v4"] }
envy = "0.4.2"
url = { version = "2", features = ["serde"] }
trace = "0.1.6"
tower-http = { version = "0.3.4", features = ["trace", "compression-deflate", "cors", "sensitive-headers"] }
strum = { version = "0.24", features = ["derive"] }
strum_macros = "0.24.0"
futures-util = "0.3.21"
mime = "0.3.16"
chrono = { version = "0.4.19", features = ["serde"] }
tower = "0.4.12"
const_format = "0.2.24"
hotwatch = "0.4.6"
blake3 = "1.3.1"
tree_magic= "0.2.3"
regex = "1.5.6"
once_cell = "1.12.0"
tokio-util = { version = "0.7.3", features = ["io"] }
serde_with = "1.14.0"
