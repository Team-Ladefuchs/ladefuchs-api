[package]
name = "ladefuchs-api"
version = "0.5.9"
edition = "2021"
license = "MIT"

[profile.release]
strip = "debuginfo"
opt-level = 3
debug = false

[dependencies]
thiserror = "1.0.32"
tokio = { version = "1.20.1", features = ["macros", "net", "fs", "rt"] }
sqlx = { version = "0.6.1", default-features = false, features = [ "runtime-tokio-rustls", "postgres", "migrate", "macros", "chrono", "uuid", "offline"] }
reqwest = { version = "0.11.11", default-features = false, features = ["json", "rustls-tls"] } 
eyre = "0.6.8"
serde = { version = "1.0.142", features = ["derive"] }
serde_json = "1.0.83"
axum = { version = "0.5.13", features = ["http2", "tower-log", "query"] }
tracing = "0.1.36"
tracing-subscriber = { version = "0.3.15", features = ["env-filter", "json", "ansi", "time"] }
uuid = { version = "1.1.2", features = ["serde", "v4"] }
envy = "0.4.2"
url = { version = "2.2.2", features = ["serde"] }
trace = "0.1.6"
tower-http = { version = "0.3.4", features = ["trace", "compression-deflate", "cors", "sensitive-headers", "fs"] }
tower-cookies = { version = "0.7.0", features = ["private", "signed"] }
strum = { version = "0.24.1", features = ["derive"] }
strum_macros = "0.24.2"
futures-util = "0.3.21"
mime = "0.3.16"
chrono = { version = "0.4.20", features = ["serde"] }
tower = "0.4.13"
const_format = "0.2.26"
hotwatch = "0.4.6"
blake3 = "1.3.1"
tree_magic_mini = "3.0.3"
regex = "1.6.0"
once_cell = "1.13.0"
tokio-util = { version = "0.7.3", features = ["io"] }
serde_with = "2.0.0"
rand = "0.8.5"
bcrypt = "0.13.0"
cookie = "0.16.0"
urlencoding = "2.1.0"

