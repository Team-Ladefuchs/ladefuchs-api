openapi: "3.0.3"
info:
  version: "1.0"
  description: |
    This is the Ladefuchs API that provides the data for the Android and IOS app. It caches daily the current charge prices from the [Chargeprice API](https://github.com/chargeprice/chargeprice-api-docs). In terms of security, this API uses the Bearer Authentication.  
    Every request has to include a valid token in the request header. Internally this API uses the [Chargeprice API](https://github.com/chargeprice/chargeprice-api-docs), this means that only a selected group can use this API. Keep this token privately and **do not expose** your token to the public.
  title: Ladefuchs API
  license:
    name: MIT
servers:
  - url: "{protocol}://api.ladefuchs.app"
    variables:
      protocol:
        enum:
          - http
          - https
        default: https
  - url: "{protocol}://beta.api.ladefuchs.app"
    variables:
      protocol:
        enum:
          - http
          - https
        default: https
tags:
  - name: cards
    description: The charge prices
  - name: operators
    description: All operators who may be needed later to retrieve the prices
paths:
  /operators/{mode}:
    get:
      tags:
        - operators
      description: Return a list of all available operators
      summary: "A list of operators"
      parameters:
        - in: path
          name: mode
          required: true
          schema:
            type: string
            enum: ["all", "enabled", "disabled"]
      responses:
        200:
          description: Description
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Operator"
        400:
          $ref: "#/components/responses/BadRequestError"
        401:
          $ref: "#/components/responses/UnauthorizedError"
        500:
          $ref: "#/components/responses/InternalError"
  /cards/{country}/{cpo}/{type}:
    get:
      tags:
        - "cards"
      summary: A list of charge prices Version 1
      description: "Returns a charge price list from that specific CPO and that specific current type."
      parameters:
        - $ref: "#/components/parameters/country"
        - $ref: "#/components/parameters/CPO"
        - $ref: "#/components/parameters/type"
      responses:
        200:
          description: Description
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Card"
        400:
          $ref: "#/components/responses/BadRequestError"
        401:
          $ref: "#/components/responses/UnauthorizedError"
        500:
          $ref: "#/components/responses/InternalError"
  /v2/cards/{country}/{cpo}/{type}:
    get:
      tags:
        - "cards"
      summary: A list of charge prices Version 2
      description: "Returns a charge price list from that specific CPO and that specific current type. The Version 2 now also includes the `monthly_fee` as part of the JSON response."
      parameters:
        - $ref: "#/components/parameters/country"
        - $ref: "#/components/parameters/CPO"
        - $ref: "#/components/parameters/type"
      responses:
        200:
          description: Description
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CardV2"
        400:
          $ref: "#/components/responses/BadRequestError"
        401:
          $ref: "#/components/responses/UnauthorizedError"
        500:
          $ref: "#/components/responses/InternalError"
  /v3/cards/{country}/{cpo}/{type}:
    get:
      tags:
        - "cards"
      summary: A list of charge prices Version 3
      description: |
        ## [BETA ONLY]
        Returns a charge price list from that specific CPO and that specific current type. The Version 3 now also includes the `monthly_fee` as part of the JSON response.
      parameters:
        - $ref: "#/components/parameters/country"
        - $ref: "#/components/parameters/CPO"
        - $ref: "#/components/parameters/type"
      responses:
        200:
          description: Description
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CardV3"
        400:
          $ref: "#/components/responses/BadRequestError"
        401:
          $ref: "#/components/responses/UnauthorizedError"
        500:
          $ref: "#/components/responses/InternalError"
components:
  schemas:
    Operator:
      type: object
      properties:
        identifier:
          type: string
          example: cpo-fastned
        displayName:
          type: string
          example: Fastned
        name:
          type: string
          example: fastned
      required:
        - name
        - displayName
        - identifier
    Card:
      type: object
      properties:
        identifier:
          type: string
          example: mvv_emotion
        name:
          type: string
          example: MVV eMotion
        provider:
          type: string
          example: MVV eMotion
        price:
          type: number
          format: double
          example: 0.39
      required:
        - identifier
        - name
        - provider
        - price
    CardV2:
      allOf:
        - $ref: "#/components/schemas/Card"
        - type: object
      properties:
        monthly_fee:
          type: number
          format: double
          example: 0
        updated:
          type: integer
          format: int64
          example: 1641938519
      required:
        - monthly_fee
        - updated
    CardV3:
      allOf:
        - $ref: "#/components/schemas/Card"
        - type: object
      properties:
        identifier:
          type: string
          format: uuid
          example: 97960a25-8009-4250-8e61-b40651e2be99
        monthly_fee:
          type: number
          format: double
          example: 0
        updated:
          type: integer
          format: int64
          example: 1641938519
      required:
        - monthly_fee
        - updated
    Error:
      type: object
      properties:
        status_code:
          description: HTTP response status codes
          type: integer
          example: 500
          minimum: 100
          maximum: 599
        reason:
          type: string
      required:
        - status_code
        - reason
  parameters:
    country:
      in: path
      name: country
      required: true
      description: Currently only de is be supported.
      schema:
        type: string
        example: de
    CPO:
      in: path
      name: cpo
      required: true
      description: The Provider name.
      schema:
        type: string
        example: allego
    type:
      in: path
      name: type
      required: true
      description: Choose a current type.
      schema:
        type: string
        enum: ["ac", "dc"]
  securitySchemes:
    bearerAuth: # arbitrary name for the security scheme
      type: http
      scheme: bearer
  responses:
    UnauthorizedError:
      description: Access token is missing or invalid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            status_code: 401
            reason: "wrong authorization token got: `xxxxxyyy`"
    BadRequestError:
      description: Wrong parameters were passed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            status_code: 400
            reason: "unknown variant enable, expected one of All, Enabled, Disabled"
    InternalError:
      description: An Unkown error has occured
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            status_code: 500
            reason: Internal server error
security:
  - bearerAuth: []
